name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Migrator unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test

  mock-migration:
    name: Mock-mode migration against the live demo site
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playwright-output/package-lock.json

      - name: Install Playwright
        working-directory: playwright-output
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build migrator
        working-directory: migrator
        run: mvn -B -q package -DskipTests

      - name: Remove committed specs so the run regenerates them
        run: rm -f playwright-output/tests/*.spec.ts playwright-output/pages/*.ts

      - name: Run migration (mock LLM, real Playwright runs)
        working-directory: migrator
        run: java -jar target/migrator.jar

      - name: Type-check and run the full converted suite
        working-directory: playwright-output
        run: |
          npm run typecheck
          npx playwright test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-reports
          path: |
            migrator/target/migration-report/
            playwright-output/playwright-report/
          if-no-files-found: ignore
